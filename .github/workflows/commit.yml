name: Sync DNS to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "domains/**"

jobs:
  sync-dns:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need prev commit to detect changes

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get changed domain files
        id: diff
        run: node util/get-changed-domains.js >> $GITHUB_OUTPUT

      - name: Sync changed domains to Cloudflare
        if: steps.diff.outputs.changes != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          COMMIT_SHA: ${{ github.sha }}
          CF_CHANGES: ${{ steps.diff.outputs.changes }}
        run: node util/sync-cloudflare.js
